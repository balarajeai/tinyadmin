spring:
  application:
    name: tinyadmin-cloud
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tinyadmin}
    username: ${DATABASE_USERNAME:tinyadmin}
    password: ${DATABASE_PASSWORD:tinyadmin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    com.tinyadmin.cloud: DEBUG
